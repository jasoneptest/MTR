<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>港鐵跨線轉乘</title>
<style>
  :root {
    --font-scale: 1;
    --bg: #111317;
    --card: #1d2026;
    --card-inner: #262a33;
    --card-border: #2e333e;
    --text: #f3f4f6;
    --muted: #9ca3af;
    --accent: #005596;
    --green: #16a34a;
    --red: #ef4444;
    --amber: #f59e0b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: calc(14px * var(--font-scale));
    line-height: 1.4;
  }

  /* 1. 頂部深藍標題列 */
  .top-header {
    background: linear-gradient(90deg, #004b87 0%, #0066b2 100%);
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    margin-bottom: 14px;
  }
  .header-left {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .app-title {
    margin: 0;
    font-size: calc(18px * var(--font-scale));
    font-weight: 700;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .mtr-badge-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background: #ffffff;
    color: #d9232e;
    font-size: 14px;
    font-weight: 900;
  }
  .header-sub {
    font-size: calc(12px * var(--font-scale));
    color: rgba(255, 255, 255, 0.85);
    padding-left: 2px;
  }
  .header-controls {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .font-slider-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 12px;
    color: #ffffff;
  }
  #fontSlider {
    -webkit-appearance: none;
    width: 68px;
    height: 4px;
    border-radius: 2px;
    outline: none;
  }
  #fontSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #ffffff;
    cursor: pointer;
  }
  .lang-pill-btn {
    background: rgba(255, 255, 255, 0.15);
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.35);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: calc(12px * var(--font-scale));
    font-weight: 600;
    cursor: pointer;
  }
  .lang-pill-btn:hover { background: rgba(255, 255, 255, 0.25); }

  /* 主內容滿版留邊容器 */
  .main-wrapper {
    width: 100%;
    padding: 0 16px 24px;
  }

  .section-box {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 14px;
  }

  /* 2. 預設常用路線區塊 */
  .preset-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .preset-title-label {
    font-size: calc(13px * var(--font-scale));
    font-weight: 700;
    color: #fbbf24;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .save-preset-btn {
    background: #16a34a;
    color: #ffffff;
    border: none;
    border-radius: 20px;
    padding: 5px 14px;
    font-size: calc(12px * var(--font-scale));
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(22, 163, 74, 0.35);
  }
  .save-preset-btn:hover { background: #15803d; }

  .preset-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .preset-chip {
    display: inline-flex;
    align-items: center;
    background: #252932;
    border: 1px solid #383e4c;
    color: #e5e7eb;
    border-radius: 20px;
    padding: 5px 12px;
    font-size: calc(13px * var(--font-scale));
    cursor: pointer;
    gap: 8px;
    transition: all 0.15s;
  }
  .preset-chip:hover { border-color: #6b7280; }
  .preset-chip.active {
    background: rgba(245, 158, 11, 0.16);
    border-color: #f59e0b;
    color: #fbbf24;
    font-weight: 700;
  }
  .preset-del {
    color: #ef4444;
    font-weight: 700;
    padding: 0 2px;
    font-size: 14px;
    line-height: 1;
  }
  .preset-del:hover { color: #f87171; }

  /* 3. 起終點選擇區 */
  .route-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 10px;
  }
  .route-row-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .station-label {
    font-size: calc(13px * var(--font-scale));
    font-weight: 700;
    color: #d1d5db;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .dot-origin {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
  }
  .dot-dest {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ef4444;
  }
  .right-tools-group {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tool-btn-locate {
    background: rgba(16, 185, 129, 0.15);
    color: #34d399;
    border: 1px solid rgba(16, 185, 129, 0.45);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: calc(12px * var(--font-scale));
    font-weight: 600;
    cursor: pointer;
  }
  .tool-btn-locate:hover { background: rgba(16, 185, 129, 0.25); }
  .tool-btn-exit {
    background: rgba(245, 158, 11, 0.15);
    color: #fbbf24;
    border: 1px solid rgba(245, 158, 11, 0.45);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: calc(12px * var(--font-scale));
    font-weight: 600;
    cursor: pointer;
  }
  .tool-btn-exit:hover { background: rgba(245, 158, 11, 0.25); }

  .select-pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  select {
    width: 100%;
    background: #262a33;
    color: #f9fafb;
    border: 1px solid #3a404d;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: calc(14px * var(--font-scale));
    outline: none;
    cursor: pointer;
  }
  select:focus { border-color: #60a5fa; }

  .swap-row {
    display: flex;
    justify-content: center;
    margin: 10px 0 8px;
  }
  .swap-pill-btn {
    background: #252932;
    color: #fbbf24;
    border: 1px solid #3a404d;
    border-radius: 20px;
    padding: 6px 18px;
    font-size: calc(13px * var(--font-scale));
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .swap-pill-btn:hover { background: #2f3440; border-color: #fbbf24; }

  .loc-status {
    display: none;
    font-size: calc(12px * var(--font-scale));
    background: #161920;
    border: 1px solid #2e3440;
    border-radius: 8px;
    padding: 8px 10px;
    margin-top: 4px;
    line-height: 1.45;
  }
  .loc-nav-link, .dest-exit-nav-link, .suggest-map-link {
    display: inline-block;
    margin-top: 6px;
    background: #1d4ed8;
    color: #ffffff;
    text-decoration: none;
    padding: 5px 10px;
    border-radius: 8px;
    font-size: calc(12px * var(--font-scale));
    font-weight: 600;
  }
  .dest-exit-wrap {
    background: #161920;
    border: 1px solid #2e3646;
    border-radius: 8px;
    padding: 8px 10px;
    margin-top: 4px;
  }
  .dest-exit-badge {
    font-size: calc(12px * var(--font-scale));
    color: #93c5fd;
    font-weight: 600;
  }

  /* 4. 行程摘要橫條 */
  .summary-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #252932;
    border: 1px solid #353b48;
    border-radius: 8px;
    padding: 10px 16px;
    margin-top: 14px;
    font-size: calc(13.5px * var(--font-scale));
    font-weight: 700;
    color: #fbbf24;
  }

  /* 5. 班次卡片區塊 */
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .seg-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    padding-bottom: 10px;
    margin-bottom: 10px;
    border-bottom: 1px solid #2d323d;
    flex-wrap: wrap;
  }
  .seg-title {
    font-size: calc(16px * var(--font-scale));
    font-weight: 700;
    color: #ffffff;
  }
  .line-pill {
    color: #ffffff;
    padding: 4px 12px;
    border-radius: 14px;
    font-size: calc(12px * var(--font-scale));
    font-weight: 700;
    text-shadow: 0 1px 2px rgba(0,0,0,0.45);
  }
  .first-last-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    background: #252932;
    border-radius: 8px;
    padding: 8px 14px;
    margin-bottom: 10px;
    font-size: calc(12px * var(--font-scale));
  }
  .fl-label { color: #9ca3af; }
  .fl-val { font-weight: 700; margin-top: 2px; }
  .fl-val.first { color: #38bdf8; }
  .fl-val.last { color: #fbbf24; }

  .train-list-wrap {
    display: flex;
    flex-direction: column;
  }
  .train-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 4px;
    border-bottom: 1px solid #2a2f3a;
  }
  .train-row:last-child { border-bottom: none; padding-bottom: 4px; }
  .train-dest {
    font-weight: 700;
    font-size: calc(15px * var(--font-scale));
    color: #f9fafb;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
  }
  .train-sub {
    font-size: calc(12px * var(--font-scale));
    color: #9ca3af;
    margin-top: 2px;
  }
  .train-right { text-align: right; }
  .ttnt-val {
    font-size: calc(15px * var(--font-scale));
    font-weight: 700;
    color: #22c55e;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 5px;
  }
  .ttnt-soon { color: #f87171; }
  .eta-val {
    font-size: calc(12px * var(--font-scale));
    color: #fbbf24;
    font-weight: 600;
    margin-top: 2px;
  }
  .badge-catch {
    background: rgba(16, 185, 129, 0.2);
    color: #34d399;
    border: 1px solid rgba(16, 185, 129, 0.45);
    font-size: calc(11px * var(--font-scale));
    padding: 1px 6px;
    border-radius: 6px;
    font-weight: 700;
  }
  .badge-warn {
    background: rgba(245, 158, 11, 0.2);
    color: #fbbf24;
    border: 1px solid rgba(245, 158, 11, 0.45);
    font-size: calc(11px * var(--font-scale));
    padding: 1px 6px;
    border-radius: 6px;
    font-weight: 700;
  }
  .transfer-divider {
    display: flex;
    justify-content: center;
    margin: 8px 0 12px;
  }
  .transfer-pill {
    background: #252932;
    border: 1px dashed #4b5563;
    color: #fbbf24;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: calc(12.5px * var(--font-scale));
    font-weight: 600;
  }
  .footer-bar {
    text-align: center;
    font-size: calc(12px * var(--font-scale));
    color: #9ca3af;
    margin-top: 10px;
  }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.72);
    z-index: 999;
    padding: 14px;
    overflow-y: auto;
  }
  .modal-overlay.open { display: block; }
  .modal-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    max-width: 640px;
    margin: 18px auto;
    padding: 16px;
  }
  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .modal-head h3 {
    margin: 0;
    font-size: calc(16px * var(--font-scale));
  }
  .pill-btn {
    background: #252932;
    color: var(--text);
    border: 1px solid #3a404d;
    border-radius: 20px;
    padding: 6px 12px;
    font-size: calc(12px * var(--font-scale));
    font-weight: 600;
    cursor: pointer;
  }
  .search-form {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .search-form input {
    flex: 1;
    background: #14171d;
    color: var(--text);
    border: 1px solid #374151;
    border-radius: 8px;
    padding: 9px 12px;
    font-size: calc(14px * var(--font-scale));
    outline: none;
  }
  .suggest-item {
    background: #161920;
    border: 1px solid #2d323d;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .suggest-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  .suggest-sta-line {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 700;
    font-size: calc(14px * var(--font-scale));
  }
  .suggest-line-pill {
    color: #fff;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .suggest-exit-badge {
    background: #2563eb;
    color: #fff;
    font-weight: 700;
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 8px;
  }
  .suggest-landmarks {
    font-size: calc(13px * var(--font-scale));
    color: #d1d5db;
    line-height: 1.45;
  }
  .suggest-landmarks mark {
    background: #fde047;
    color: #111827;
    padding: 0 2px;
    border-radius: 3px;
  }
  .suggest-actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .suggest-map-link { margin-top: 0; }
  .suggest-confirm-btn {
    background: #16a34a;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 5px 10px;
    font-size: calc(12px * var(--font-scale));
    font-weight: 600;
    cursor: pointer;
  }

  @media (max-width: 600px) {
    .top-header { padding: 10px 12px; }
    .main-wrapper { padding: 0 10px 20px; }
    .select-pair { grid-template-columns: 1fr 1fr; gap: 8px; }
    .select-pair select { padding: 9px 8px; font-size: calc(13px * var(--font-scale)); }
    .summary-bar { flex-direction: row; justify-content: space-between; gap: 4px; padding: 9px 10px; font-size: calc(12px * var(--font-scale)); white-space: nowrap; }
  }
</style>
</head>
<body>

<header class="top-header">
  <div class="header-left">
    <h1 class="app-title"><span class="mtr-badge-icon">🚇</span> <span id="uiTitle">港鐵跨線轉乘</span></h1>
    <div class="header-sub" id="lastUpdate">最後更新 : --:--:--</div>
  </div>
  <div class="header-controls">
    <div class="font-slider-wrap">
      <span style="font-size:11px;">A</span>
      <input type="range" id="fontSlider" min="0.9" max="1.45" step="0.05" value="1">
      <span style="font-size:14px;font-weight:700;">A</span>
    </div>
    <button type="button" class="lang-pill-btn" id="langBtn">Eng</button>
  </div>
</header>

<div class="main-wrapper">
  <!-- 常用路線區塊 -->
  <div class="section-box">
    <div class="preset-header">
      <span class="preset-title-label">★ <span id="uiPresetTitle">預設常用路線 (點擊一鍵查詢)</span></span>
      <button type="button" class="save-preset-btn" id="savePresetBtn">+ 儲存目前路線</button>
    </div>
    <div class="preset-list" id="presetList"></div>
  </div>

  <!-- 起終點與摘要區塊 -->
  <div class="section-box">
    <div class="route-row">
      <div class="route-row-top">
        <span class="station-label"><span class="dot-origin"></span> <span id="uiOriginLabel">起點站 (選擇路線及車站)</span></span>
        <div class="right-tools-group">
          <button type="button" class="tool-btn-locate" id="locateBtn">📍 <span id="uiLocateText">定位最近站</span></button>
        </div>
      </div>
      <div class="select-pair">
        <select id="startLine"></select>
        <select id="startSta"></select>
      </div>
      <div class="loc-status" id="locStatus"></div>
    </div>

    <div class="swap-row">
      <button type="button" class="swap-pill-btn" id="swapBtn">⇅ <span id="uiSwapText">起終點互換 (回程查詢)</span></button>
    </div>

    <div class="route-row" style="margin-bottom:0;">
      <div class="route-row-top">
        <span class="station-label"><span class="dot-dest"></span> <span id="uiDestLabel">終點站 (選擇路線及車站)</span></span>
        <div class="right-tools-group">
          <button type="button" class="tool-btn-exit" id="suggestExitBtn">🚪 <span id="uiSuggestExitText">建議出口</span></button>
        </div>
      </div>
      <div class="select-pair">
        <select id="endLine"></select>
        <select id="endSta"></select>
      </div>
      <div id="destExitHint" style="display:none;"></div>
    </div>

    <div class="summary-bar" id="summaryBar"></div>
  </div>

  <!-- 行程與實時班次列表 -->
  <div id="itineraryContainer"></div>

  <!-- 底部資訊列 -->
  <div class="footer-bar" id="uiFooterNote">
    每 10 秒自動刷新 ｜ 港鐵規定尾班車開出前 5 分鐘停止入閘
  </div>
</div>

<!-- 出入口及地標搜尋視窗 -->
<div class="modal-overlay" id="suggestModal">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="suggestModalTitle">搜尋車站出入口 / 地標</h3>
      <button type="button" class="pill-btn" id="suggestModalClose">✕</button>
    </div>
    <form class="search-form" id="suggestSearchForm">
      <input type="text" id="suggestSearchInput" placeholder="輸入大廈、商場、醫院、街道或站名...">
      <button type="submit" class="pill-btn" id="suggestSearchGoBtn" style="background:#2563eb;border-color:#2563eb;color:#fff;">搜尋</button>
    </form>
    <div id="suggestModalBody"></div>
  </div>
</div>

<script>
const API_URL = "https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php";
let currentLang = "TC";
try {
  const savedLang = localStorage.getItem("mtr_preferred_lang");
  if (savedLang === "TC" || savedLang === "EN") currentLang = savedLang;
} catch (e) {}

const I18N = {
  TC: {
    title: "港鐵跨線轉乘",
    langBtn: "Eng",
    presetTitle: "預設常用路線 (點擊一鍵查詢)",
    savePreset: "+ 儲存目前路線",
    originLabel: "起點站 (選擇路線及車站)",
    locateText: "定位最近站及入口",
    suggestExitBtnText: "建議出口",
    destLabel: "終點站 (選擇路線及車站)",
    suggestModalTitle: "搜尋建議出口 / 地標",
    suggestSearchBtn: "搜尋",
    suggestSearchPlaceholder: "輸入商場、醫院、屋苑、街道或站名...",
    swapText: "起終點互換 (回程查詢)",
    footerNote: "每 10 秒自動刷新 ｜ 港鐵規定尾班車開出前 5 分鐘停止入閘",
    lastUpdate: "最後更新 : ",
    sameStation: "起點站與終點站相同，請重新選擇。",
    totalPrefix: "共 ",
    stopsUnit: "個站",
    directText: "直達 (0 次轉乘)",
    transferText: (n) => `需轉乘 ${n} 次`,
    estTime: (m) => `總車程約 ${m} 分鐘`,
    transferWalk: (sta, line, mins) => `🚶 於 ${sta} 轉乘 ${line}（步行約 ${mins} 分鐘）`,
    towards: "往",

];

const GRAPH = {};
function addEdge(u, v, cost, type, line, dir) {
    if (!GRAPH[u]) GRAPH[u] = [];
    GRAPH[u].push({ to: v, cost, type, line, dir });
}

Object.entries(LINES).forEach(([lineCode, info]) => {
    const stas = info.stations;
    for (let i = 0; i < stas.length - 1; i++) {
        const u = `${lineCode}:${stas[i]}`;
        const v = `${lineCode}:${stas[i+1]}`;
        if (info.branchSplit === "SHS" && stas[i] === "LOW" && stas[i+1] === "LMC") continue;
        if (info.branchSplit === "TKO" && stas[i] === "POA" && stas[i+1] === "LHP") continue;
        const t = info.times[i] || 2;
        addEdge(u, v, t, "RIDE", lineCode, "UP");
        addEdge(v, u, t, "RIDE", lineCode, "DOWN");
    }
    if (info.branchSplit === "SHS") {
        addEdge("EAL:SHS", "EAL:LMC", 5, "RIDE", "EAL", "UP");
        addEdge("EAL:LMC", "EAL:SHS", 5, "RIDE", "EAL", "DOWN");
    }
    if (info.branchSplit === "TKO") {
        addEdge("TKL:TKO", "TKL:LHP", 4, "RIDE", "TKL", "UP");
        addEdge("TKL:LHP", "TKL:TKO", 4, "RIDE", "TKL", "DOWN");
    }
});

INTERCHANGES.forEach(([l1, s1, l2, s2, walkMins]) => {
    const u = `${l1}:${s1}`;
    const v = `${l2}:${s2}`;
    const penalty = walkMins + 6;
    addEdge(u, v, penalty, "TRANSFER", l2, walkMins);
    addEdge(v, u, penalty, "TRANSFER", l1, walkMins);
});

function findShortestPath(startNode, endNode) {
    if (startNode === endNode) return [];
    const [sLine, sSta] = startNode.split(":");
    const [eLine, eSta] = endNode.split(":");

    if (sLine === eLine) {
        const lineInfo = LINES[sLine];
        const sIdx = lineInfo.stations.indexOf(sSta);
        const eIdx = lineInfo.stations.indexOf(eSta);
        const isBranchConflict =
            (lineInfo.branch1 && lineInfo.branch2) &&
            ((lineInfo.branch1.includes(sSta) && lineInfo.branch2.includes(eSta)) ||
             (lineInfo.branch2.includes(sSta) && lineInfo.branch1.includes(eSta)));

        if (!isBranchConflict && sIdx !== -1 && eIdx !== -1) {
            const dir = sIdx < eIdx ? "UP" : "DOWN";
            let mins = 0;
            const minI = Math.min(sIdx, eIdx);
            const maxI = Math.max(sIdx, eIdx);
            for (let i = minI; i < maxI; i++) mins += (lineInfo.times[i] || 2);
            return [{ type: "RIDE", line: sLine, dir: dir, fromSta: sSta, toSta: eSta, stops: maxI - minI, mins: mins }];
        }
    }

    const dist = {};
    const prev = {};
    const unvisited = new Set(Object.keys(GRAPH));
    unvisited.forEach(node => dist[node] = Infinity);
    dist[startNode] = 0;

    while (unvisited.size > 0) {
        let u = null;
        let minD = Infinity;
        unvisited.forEach(node => {
            if (dist[node] < minD) { minD = dist[node]; u = node; }
        });
        if (!u || u === endNode) break;
        unvisited.delete(u);

        (GRAPH[u] || []).forEach(edge => {
            if (!unvisited.has(edge.to)) return;
            const alt = dist[u] + edge.cost;
            if (alt < dist[edge.to]) {
                dist[edge.to] = alt;
                prev[edge.to] = { node: u, edge };
            }
        });
    }

    const rawEdges = [];
    let curr = endNode;
    while (prev[curr]) {
        rawEdges.unshift({ from: prev[curr].node, to: curr, ...prev[curr].edge });
        curr = prev[curr].node;
    }

    const segments = [];
    rawEdges.forEach(e => {
        if (e.type === "TRANSFER") {
            segments.push({ type: "TRANSFER", fromSta: e.from.split(":")[1], toSta: e.to.split(":")[1], toLine: e.line, walkMins: e.dir });
        } else {
            const last = segments[segments.length - 1];
            if (last && last.type === "RIDE" && last.line === e.line && last.dir === e.dir) {
                last.toSta = e.to.split(":")[1];
                last.stops += 1;
                last.mins += e.cost;
            } else {
                segments.push({ type: "RIDE", line: e.line, dir: e.dir, fromSta: e.from.split(":")[1], toSta: e.to.split(":")[1], stops: 1, mins: e.cost });
            }
        }
    });
    return segments;
}

const DEFAULT_PRESETS = [
    { sLine: "TML", sSta: "CIO", eLine: "TML", eSta: "NAC" },
    { sLine: "TML", sSta: "NAC", eLine: "TML", eSta: "CIO" },
    { sLine: "TML", sSta: "CIO", eLine: "TCL", eSta: "TUC" },
    { sLine: "TML", sSta: "CIO", eLine: "EAL", eSta: "ADM" }
];

function getPresets() {
    try {
        const saved = localStorage.getItem("mtr_custom_presets_v2");
        if (saved) return JSON.parse(saved);
    } catch (e) {}
    return DEFAULT_PRESETS;
}

function savePresets(list) {
    try { localStorage.setItem("mtr_custom_presets_v2", JSON.stringify(list)); } catch (e) {}
}

function renderPresets() {
    const list = getPresets();
    const container = document.getElementById("presetList");
    const curSLine = startLineSel.value;
    const curSSta = startStaSel.value;
    const curELine = endLineSel.value;
    const curESta = endStaSel.value;

    container.innerHTML = "";
    list.forEach((p, idx) => {
        const isActive = (p.sLine === curSLine && p.sSta === curSSta && p.eLine === curELine && p.eSta === curESta);
        const chip = document.createElement("div");
        chip.className = `preset-chip ${isActive ? 'active' : ''}`;

        const textSpan = document.createElement("span");
        textSpan.className = "preset-text";
        textSpan.textContent = `${stName(p.sSta)} ➔ ${stName(p.eSta)}`;
        textSpan.onclick = () => {
            clearLocStatus();
            startLineSel.value = p.sLine;
            populateStations(startLineSel, startStaSel, p.sSta);
            endLineSel.value = p.eLine;
            populateStations(endLineSel, endStaSel, p.eSta);
            renderPresets();
            updateDashboard();
        };

        const delSpan = document.createElement("span");
        delSpan.className = "preset-del";
        delSpan.textContent = "×";
        delSpan.onclick = (e) => {
            e.stopPropagation();
            const updated = getPresets().filter((_, i) => i !== idx);
            savePresets(updated);
            renderPresets();
        };

        chip.appendChild(textSpan);
        chip.appendChild(delSpan);
        container.appendChild(chip);
    });
}

function populateLines() {
    const prevSLine = startLineSel.value || "TML";
    const prevELine = endLineSel.value || "TML";
    startLineSel.innerHTML = "";
    endLineSel.innerHTML = "";

    Object.entries(LINES).forEach(([code, info]) => {
        const label = `${info.name[currentLang]} (${info.colorName[currentLang]})`;
        startLineSel.add(new Option(label, code));
        endLineSel.add(new Option(label, code));
    });

    startLineSel.value = prevSLine;
    endLineSel.value = prevELine;
}

function populateStations(lineSelect, staSelect, defaultSta) {
    const lineCode = lineSelect.value;
    const prevSta = defaultSta || staSelect.value;
    staSelect.innerHTML = "";
    LINES[lineCode].stations.forEach(staCode => {
        staSelect.add(new Option(stName(staCode), staCode));
    });
    if (prevSta && LINES[lineCode].stations.includes(prevSta)) {
        staSelect.value = prevSta;
    }
}

function getTerminalLabel(lineCode, dir) {
    const info = LINES[lineCode];
    if (dir === "UP") {
        if (lineCode === "EAL") return `${stName("LOW")} / ${stName("LMC")}`;
        if (lineCode === "TKL") return `${stName("POA")} / ${stName("LHP")}`;
        return stName(info.stations[info.stations.length - 1]);
    } else {
        return stName(info.stations[0]);
    }
}

async function fetchSegmentTrains(seg, earliestCatchTime) {
    const t = I18N[currentLang];
    try {
        const res = await fetch(`${API_URL}?line=${seg.line}&sta=${seg.fromSta}&lang=${currentLang}`);
        const data = await res.json();
        if (data.status !== 1) {
            return { html: `<div style="color:#ff9500;font-size:calc(12px * var(--font-scale, 1));">${t.sysUnavail}</div>`, arrivalAtSegEnd: null };
        }

        const staData = data.data && data.data[`${seg.line}-${seg.fromSta}`];
        if (!staData) {
            return { html: `<div style="color:#ff9500;font-size:calc(12px * var(--font-scale, 1));">${t.sysUnavail}</div>`, arrivalAtSegEnd: null };
        }

        const trains = staData[seg.dir] || [];
        if (!trains.length) {
            return { html: `<div style="color:#888;font-size:calc(12px * var(--font-scale, 1));">${t.noTrains}</div>`, arrivalAtSegEnd: null };
        }

        let recommendedMarked = false;
        const lineStas = LINES[seg.line].stations;
        const destIdx = lineStas.indexOf(seg.toSta);

        const rowsHtml = trains.map(tr => {
            const destName = stName(tr.dest);
            const isDeparting = tr.ttnt === "0";
            const isArriving = tr.ttnt === "1";
            const isSoon = isDeparting || isArriving;
            const waitText = isDeparting ? t.departing : (isArriving ? t.arriving : `${tr.ttnt} ${t.mins}`);

            let etaStr = "";
            let catchBadge = "";
            let depDate = null;

            if (tr.time && tr.time.includes(" ")) {
                depDate = new Date(tr.time.replace(" ", "T"));
                if (!isNaN(depDate)) {
                    const arrDate = new Date(depDate.getTime() + seg.mins * 60000);
                    const hh = String(arrDate.getHours()).padStart(2, '0');
                    const mm = String(arrDate.getMinutes()).padStart(2, '0');
                    etaStr = `${t.arr} ${stName(seg.toSta)} ~${hh}:${mm}`;

                    if (earliestCatchTime && !recommendedMarked && depDate >= earliestCatchTime) {
                        catchBadge = `<span class="badge-catch">${t.catchThis}</span>`;
                        recommendedMarked = true;
                    }
                }
            }

            let warnBadge = "";
            const trEndIdx = lineStas.indexOf(tr.dest);
            if (trEndIdx !== -1 && destIdx !== -1) {
                if ((seg.dir === "UP" && trEndIdx < destIdx) || (seg.dir === "DOWN" && trEndIdx > destIdx)) {
                    warnBadge = `<span class="badge-warn">${t.shortTurn(destName)}</span>`;
                }
            }

            return {
                depDate,
                html: `
                    <div class="train-row">
                        <div class="train-left">
                            <div class="train-dest">${t.toDest} ${destName} ${catchBadge} ${warnBadge}</div>
                            <div class="train-sub">${currentLang === 'TC' ? tr.plat + ' ' + t.plat : t.plat + ' ' + tr.plat}</div>
                        </div>
                        <div class="train-right">
                            <div class="ttnt-val ${isSoon ? 'ttnt-soon' : ''}">${waitText}</div>
                            <div class="eta-val">${etaStr}</div>
                        </div>
                    </div>
                `
            };
        });

        const firstValid = rowsHtml.find(r => !earliestCatchTime || (r.depDate && r.depDate >= earliestCatchTime)) || rowsHtml[0];
        const arrivalAtSegEnd = firstValid && firstValid.depDate ? new Date(firstValid.depDate.getTime() + seg.mins * 60000) : null;

        return { html: `<div class="train-list-wrap">${rowsHtml.map(r => r.html).join("")}</div>`, arrivalAtSegEnd };
    } catch (e) {
        return { html: `<div style="color:#ff3b30;font-size:calc(12px * var(--font-scale, 1));">${t.connErr}</div>`, arrivalAtSegEnd: null };
    }
}

let currentRequestId = 0;
let lastRenderedKey = "";

async function updateDashboard(isAutoRefresh = false) {
    const reqId = ++currentRequestId;
    const t = I18N[currentLang];
    const startNode = `${startLineSel.value}:${startStaSel.value}`;
    const endNode = `${endLineSel.value}:${endStaSel.value}`;
    const renderKey = `${currentLang}|${startNode}|${endNode}`;
    const container = document.getElementById("itineraryContainer");

    if (!isAutoRefresh) renderPresets();

    if (startNode === endNode) {
        lastRenderedKey = renderKey;
        document.getElementById("summaryBar").innerHTML = `<span style="color:#f87171;width:100%;text-align:center;">${t.sameStation}</span>`;
        container.innerHTML = "";
        return;
    }

    const segments = findShortestPath(startNode, endNode);
    const canSilentUpdate = isAutoRefresh && (lastRenderedKey === renderKey) && container.children.length > 0;

    if (!canSilentUpdate) {
        lastRenderedKey = renderKey;
        let totalStops = 0, totalMins = 0, transferCount = 0;
        segments.forEach(s => {
            if (s.type === "RIDE") { totalStops += s.stops; totalMins += s.mins; }
            else { totalMins += s.walkMins; transferCount += 1; }
        });

        document.getElementById("summaryBar").innerHTML = `
            <span>${t.totalPrefix}${totalStops} ${t.stopsUnit}</span>
            <span>${transferCount === 0 ? t.directText : t.transferText(transferCount)}</span>
            <span>${t.estTime(totalMins)}</span>
        `;

        container.innerHTML = segments.map((seg, idx) => {
            if (seg.type === "TRANSFER") {
                const staDisplay = seg.fromSta === seg.toSta ? stName(seg.fromSta) : `${stName(seg.fromSta)} ➔ ${stName(seg.toSta)}`;
                return `<div class="transfer-divider"><div class="transfer-pill">${t.transferWalk(staDisplay, lnName(seg.toLine), seg.walkMins)}</div></div>`;
            } else {
                const lineInfo = LINES[seg.line];
                const termName = getTerminalLabel(seg.line, seg.dir);
                const staFirstTime = getStationFirstTrain(seg.line, seg.dir, seg.fromSta);
                const staLastTime = getStationLastTrain(seg.line, seg.dir, seg.fromSta);
                const firstDisplay = `${staFirstTime} (${t.towards}${termName})`;
                const lastDisplay = (seg.line === "EAL" && seg.dir === "UP") || (seg.line === "TKL" && seg.dir === "UP")
                    ? staLastTime
                    : `${staLastTime} (${t.towards}${termName})`;

                return `
                    <div class="card">
                        <div class="seg-header">
                            <div class="seg-title">${stName(seg.fromSta)} ➔ ${stName(seg.toSta)}</div>
                            <div class="line-pill" style="background:${lineInfo.color};">${lnName(seg.line)}・${t.towards}${termName}</div>
                        </div>
                        <div class="first-last-box">
                            <div class="fl-item">
                                <div class="fl-label">${t.firstTrain(stName(seg.fromSta))}</div>
                                <div class="fl-val first">${firstDisplay}</div>
                            </div>
                            <div class="fl-item" style="text-align:right;">
                                <div class="fl-label">${t.lastTrain(stName(seg.fromSta))}</div>
                                <div class="fl-val last">${lastDisplay}</div>
                            </div>
                        </div>
                        <div id="seg-body-${idx}"><div style="color:#9ca3af;font-size:calc(12px * var(--font-scale, 1));">${t.loading}</div></div>
                    </div>
                `;
            }
        }).join("");
    }

    let rollingArrivalTime = null;
    for (let i = 0; i < segments.length; i++) {
        if (reqId !== currentRequestId) return;
        const seg = segments[i];
        if (seg.type === "TRANSFER") {
            if (rollingArrivalTime) rollingArrivalTime = new Date(rollingArrivalTime.getTime() + seg.walkMins * 60000);
        } else {
            const result = await fetchSegmentTrains(seg, rollingArrivalTime);
            if (reqId !== currentRequestId) return;
            const bodyEl = document.getElementById(`seg-body-${i}`);
            if (bodyEl && bodyEl.innerHTML !== result.html) bodyEl.innerHTML = result.html;
            rollingArrivalTime = result.arrivalAtSegEnd;
        }
    }

    if (reqId === currentRequestId) {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');
        document.getElementById("lastUpdate").textContent = `${t.lastUpdate}${hh}:${mm}:${ss}`;
    }
}

startLineSel.addEventListener("change", () => { clearLocStatus(); populateStations(startLineSel, startStaSel); updateDashboard(); });
startStaSel.addEventListener("change", () => { clearLocStatus(); updateDashboard(); });
endLineSel.addEventListener("change", () => { populateStations(endLineSel, endStaSel); updateDashboard(); });
endStaSel.addEventListener("change", updateDashboard);

document.getElementById("swapBtn").addEventListener("click", () => {
    clearLocStatus();
    const tmpL = startLineSel.value;
    const tmpS = startStaSel.value;
    startLineSel.value = endLineSel.value;
    populateStations(startLineSel, startStaSel, endStaSel.value);
    endLineSel.value = tmpL;
    populateStations(endLineSel, endStaSel, tmpS);
    updateDashboard();
});

document.getElementById("savePresetBtn").addEventListener("click", () => {
    const t = I18N[currentLang];
    const sLine = startLineSel.value, sSta = startStaSel.value, eLine = endLineSel.value, eSta = endStaSel.value;
    if (sLine === eLine && sSta === eSta) return;
    const list = getPresets();
    if (list.some(p => p.sLine === sLine && p.sSta === sSta && p.eLine === eLine && p.eSta === eSta)) {
        alert(t.existMsg);
        return;
    }
    list.push({ sLine, sSta, eLine, eSta });
    savePresets(list);
    renderPresets();
    alert(t.savedMsg);
});

document.getElementById("langBtn").addEventListener("click", () => {
    currentLang = currentLang === "TC" ? "EN" : "TC";
    try { localStorage.setItem("mtr_preferred_lang", currentLang); } catch (e) {}
    updateStaticTexts();
    populateLines();
    populateStations(startLineSel, startStaSel, startStaSel.value);
    populateStations(endLineSel, endStaSel, endStaSel.value);
    updateDashboard();
});

const fontSlider = document.getElementById("fontSlider");
let savedFontScale = "1";
try {
    const s = localStorage.getItem("mtr_font_scale");
    if (s && !isNaN(parseFloat(s))) savedFontScale = s;
} catch (e) {}

function applyFontSlider(val) {
    const num = Math.max(0.9, Math.min(1.45, parseFloat(val) || 1));
    const scaleStr = num.toFixed(2).replace(/\.00$/, "").replace(/(\.\d)0$/, "$1");
    document.documentElement.style.setProperty("--font-scale", scaleStr);
    if (fontSlider) {
        fontSlider.value = scaleStr;
        const pct = ((num - 0.9) / (1.45 - 0.9)) * 100;
        fontSlider.style.background = `linear-gradient(to right, #ffffff 0%, #ffffff ${pct}%, rgba(255,255,255,0.25) ${pct}%, rgba(255,255,255,0.25) 100%)`;
    }
    try { localStorage.setItem("mtr_font_scale", scaleStr); } catch (e) {}
}
if (fontSlider) fontSlider.addEventListener("input", (e) => applyFontSlider(e.target.value));
applyFontSlider(savedFontScale);

function getDefaultEntranceCode(staCode) {
    const exits = STATION_EXITS[staCode];
    return (exits && exits.length > 0) ? exits[0].code : "A";
}

function buildEntranceNavUrl(staCode, exitCode, userLat, userLng) {
    const staLabel = currentLang === "EN"
        ? `${STATION_NAMES[staCode]?.EN || staCode} MTR Station Exit ${exitCode} Hong Kong`
        : `港鐵${STATION_NAMES[staCode]?.TC || staCode}站 ${exitCode}出口 香港`;
    let url = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(staLabel)}&travelmode=walking`;
    if (typeof userLat === "number" && typeof userLng === "number") url += `&origin=${userLat},${userLng}`;
    return url;
}

function calcDistanceMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1), dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
    return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
}

function findNearestStation(lat, lng) {
    let bestSta = null, bestDist = Infinity;
    Object.entries(STATION_COORDS).forEach(([staCode, [sLat, sLng]]) => {
        if (staCode === "RAC") return; // 馬場站僅於賽馬日開放，不作日常最近站預設
        const d = calcDistanceMeters(lat, lng, sLat, sLng);
        if (d < bestDist) { bestDist = d; bestSta = staCode; }
    });
    if (!bestSta) return null;
    let bestLine = "TML";
    for (const [lineCode, info] of Object.entries(LINES)) {
        if (info.stations.includes(bestSta)) { bestLine = lineCode; break; }
    }
    const exits = STATION_EXITS[bestSta];
    const firstExit = (exits && exits.length > 0) ? exits[0] : null;
    const exitCode = firstExit ? firstExit.code : "A";
    const exitDesc = firstExit ? (currentLang === "EN" ? firstExit.en : firstExit.tc) : "";
    return { staCode: bestSta, lineCode: bestLine, exitCode, exitDesc, meters: bestDist };
}

const locStatusEl = document.getElementById("locStatus");
function clearLocStatus() {
    locStatusEl.style.display = "none";
    locStatusEl.innerHTML = "";
}

document.getElementById("locateBtn").addEventListener("click", () => {
    const t = I18N[currentLang];
    if (!navigator.geolocation) {
        locStatusEl.style.display = "block"; locStatusEl.style.color = "#ff9500"; locStatusEl.textContent = t.locUnavail; return;
    }
    locStatusEl.style.display = "block"; locStatusEl.style.color = "#a0a5b1"; locStatusEl.textContent = t.locating;

    navigator.geolocation.getCurrentPosition(
        (pos) => {
            const uLat = pos.coords.latitude, uLng = pos.coords.longitude;
            const found = findNearestStation(uLat, uLng);
            if (!found) { locStatusEl.style.color = "#ff9500"; locStatusEl.textContent = t.locUnavail; return; }
            startLineSel.value = found.lineCode;
            populateStations(startLineSel, startStaSel, found.staCode);
            const accM = Math.round(pos.coords.accuracy || 0);
            const accText = accM > 0 ? `（定位誤差約 ±${accM} 米）` : "";
            const navUrl = buildEntranceNavUrl(found.staCode, found.exitCode, uLat, uLng);
            const exitDesc = found.exitDesc ? `（${found.exitDesc}）` : "";
            locStatusEl.style.color = "#6ee787";
            locStatusEl.innerHTML = `
                <div style="font-weight:600;">${t.locSuccess(stName(found.staCode), lnName(found.lineCode), found.exitCode, found.meters)}${exitDesc}</div>
                <div style="color:#9ca3af;font-size:calc(11px * var(--font-scale, 1));margin-top:2px;">${uLat.toFixed(5)}, ${uLng.toFixed(5)}${accText}</div>
                <a class="loc-nav-link" href="${navUrl}" target="_blank" rel="noopener noreferrer">🗺️ ${t.locNavBtn(stName(found.staCode), found.exitCode)} (Google Maps)</a>
            `;
            updateDashboard(false);
        },
        (err) => {
            locStatusEl.style.display = "block"; locStatusEl.style.color = "#ff3b30";
            locStatusEl.textContent = (err && err.code === 1) ? t.locDenied : t.locUnavail;
        },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 }
    );
});

const suggestModal = document.getElementById("suggestModal");
const suggestSearchForm = document.getElementById("suggestSearchForm");
const suggestSearchInput = document.getElementById("suggestSearchInput");
const suggestModalBody = document.getElementById("suggestModalBody");
const destExitHintEl = document.getElementById("destExitHint");
let confirmedDestExit = null;

function getPrimaryLineForStation(staCode) {
    for (const [lineCode, info] of Object.entries(LINES)) {
        if (info.stations.includes(staCode)) return lineCode;
    }
    return "TML";
}

function escapeRegExp(str) { return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function highlightKeyword(text, query) {
    if (!query) return text;
    return text.replace(new RegExp(`(${escapeRegExp(query)})`, "gi"), "<mark>$1</mark>");
}

function buildExitToPlaceNavUrl(staCode, exitCode, placeName) {
    const staTc = STATION_NAMES[staCode]?.TC || staCode;
    const staEn = STATION_NAMES[staCode]?.EN || staCode;
    const originStr = currentLang === "EN" ? `${staEn} MTR Station Exit ${exitCode} Hong Kong` : `港鐵${staTc}站 ${exitCode}出口 香港`;
    const targetPlace = (placeName && placeName.trim()) ? placeName.trim() : (currentLang === "EN" ? `${staEn} MTR Station Exit ${exitCode}` : `港鐵${staTc}站 ${exitCode}出口`);
    return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(originStr)}&destination=${encodeURIComponent(`${targetPlace} Hong Kong`)}&travelmode=walking`;
}

function buildPlaceSearchUrl(query) {
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${(query || "").trim()} 港鐵出口 香港`)}`;
}

function renderDestExitHint() {
    const t = I18N[currentLang];
    if (!confirmedDestExit || confirmedDestExit.staCode !== endStaSel.value) {
        destExitHintEl.style.display = "none"; destExitHintEl.innerHTML = ""; return;
    }
    const placeLabel = confirmedDestExit.matchedPlace || confirmedDestExit.queryText || stName(confirmedDestExit.staCode);
    const navUrl = buildExitToPlaceNavUrl(confirmedDestExit.staCode, confirmedDestExit.exitCode, placeLabel);
    destExitHintEl.style.display = "block";
    destExitHintEl.innerHTML = `<div class="dest-exit-wrap"><div class="dest-exit-badge">${t.destExitTag(stName(confirmedDestExit.staCode), confirmedDestExit.exitCode, placeLabel)}</div><a class="dest-exit-nav-link" href="${navUrl}" target="_blank" rel="noopener noreferrer">${t.destCardNav(confirmedDestExit.exitCode, placeLabel)}</a></div>`;
}

endLineSel.addEventListener("change", () => { confirmedDestExit = null; renderDestExitHint(); });
endStaSel.addEventListener("change", () => { if (confirmedDestExit && confirmedDestExit.staCode !== endStaSel.value) confirmedDestExit = null; renderDestExitHint(); });

function searchAllStationExits(query) {
    const q = (query || "").trim().toLowerCase();
    if (!q) return [];
    const results = [];
    Object.entries(STATION_EXITS).forEach(([staCode, exits]) => {
        const staTc = (STATION_NAMES[staCode]?.TC || "").toLowerCase();
        const staEn = (STATION_NAMES[staCode]?.EN || "").toLowerCase();
        const lineCode = getPrimaryLineForStation(staCode);
        exits.forEach(ex => {
            const codeLower = ex.code.toLowerCase();
            let score = 0, matchedPlace = "";
            for (const p of ex.tc.split("、").map(s => s.trim())) {
                if (p.toLowerCase() === q) { score = 100; matchedPlace = p; break; }
                if (p.toLowerCase().includes(q) && score < 80) { score = 80; matchedPlace = p; }
            }
            if (score < 80) {
                for (const p of ex.en.split(",").map(s => s.trim())) {
                    if (p.toLowerCase() === q) { score = 100; matchedPlace = p; break; }
                    if (p.toLowerCase().includes(q) && score < 80) { score = 80; matchedPlace = p; }
                }
            }
            if (score === 0 && (staTc.includes(q) || staEn.includes(q))) {
                score = 40;
                matchedPlace = currentLang === "EN" ? (STATION_NAMES[staCode]?.EN || staCode) : (STATION_NAMES[staCode]?.TC || staCode);
            }
            if (score === 0 && `${staTc}${codeLower}`.includes(q)) {
                score = 50; matchedPlace = `${stName(staCode)} ${ex.code}`;
            }
            if (score > 0) results.push({ staCode, lineCode, exitCode: ex.code, tc: ex.tc, en: ex.en, matchedPlace, score });
        });
    });
    results.sort((a, b) => b.score - a.score);
    return results.slice(0, 30);
}

function renderSuggestResults(query) {
    const t = I18N[currentLang];
    const q = (query || "").trim();
    if (!q) {
        suggestModalBody.innerHTML = `<div style="color:#a0a5b1;font-size:calc(12px * var(--font-scale, 1));padding:12px 4px;line-height:1.5;">${t.suggestEmptyHint}</div>`;
        return;
    }
    const matches = searchAllStationExits(q);
    if (!matches.length) {
        suggestModalBody.innerHTML = `<div class="suggest-item"><div class="suggest-landmarks" style="color:#fbbf24;">${t.suggestNoMatch}</div><div class="suggest-actions"><a class="suggest-map-link" href="${buildPlaceSearchUrl(q)}" target="_blank" rel="noopener noreferrer">${t.suggestDirectMapSearch(q)}</a></div></div>`;
        return;
    }
    suggestModalBody.innerHTML = matches.map((item, idx) => {
        const lineInfo = LINES[item.lineCode];
        const rawDesc = currentLang === "EN" ? item.en : item.tc;
        const exitLabel = currentLang === "EN" ? `Exit ${item.exitCode}` : `${item.exitCode} 出口`;
        const targetPlaceForNav = item.matchedPlace || q;
        const navUrl = buildExitToPlaceNavUrl(item.staCode, item.exitCode, targetPlaceForNav);
        return `
            <div class="suggest-item">
                <div class="suggest-top">
                    <div class="suggest-sta-line"><span>${stName(item.staCode)}</span><span class="suggest-line-pill" style="background:${lineInfo.color};">${lnName(item.lineCode)}</span></div>
                    <span class="suggest-exit-badge">${exitLabel}</span>
                </div>
                <div class="suggest-landmarks">${highlightKeyword(rawDesc, q)}</div>
                <div class="suggest-actions">
                    <a class="suggest-map-link" href="${navUrl}" target="_blank" rel="noopener noreferrer">${t.suggestMapNav(item.exitCode, targetPlaceForNav)}</a>
                    <button type="button" class="suggest-confirm-btn" data-idx="${idx}">${t.suggestConfirmBtn}</button>
                </div>
            </div>
        `;
    }).join("");

    suggestModalBody.querySelectorAll(".suggest-confirm-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            const chosen = matches[parseInt(btn.getAttribute("data-idx"), 10)];
            if (!chosen) return;
            endLineSel.value = chosen.lineCode;
            populateStations(endLineSel, endStaSel, chosen.staCode);
            confirmedDestExit = { staCode: chosen.staCode, exitCode: chosen.exitCode, matchedPlace: chosen.matchedPlace, queryText: q };
            renderDestExitHint();
            closeSuggestModal();
            updateDashboard(false);
        });
    });
}

function openSuggestModal(initialQuery = "") {
    suggestSearchInput.value = initialQuery;
    renderSuggestResults(initialQuery);
    suggestModal.classList.add("open");
    setTimeout(() => suggestSearchInput.focus(), 50);
}
function closeSuggestModal() { suggestModal.classList.remove("open"); }

document.getElementById("suggestExitBtn").addEventListener("click", () => {
    openSuggestModal("");
});
document.getElementById("suggestModalClose").addEventListener("click", closeSuggestModal);
suggestModal.addEventListener("click", (e) => { if (e.target === suggestModal) closeSuggestModal(); });
suggestSearchForm.addEventListener("submit", (e) => { e.preventDefault(); renderSuggestResults(suggestSearchInput.value); suggestSearchInput.blur(); });
suggestSearchInput.addEventListener("input", (e) => renderSuggestResults(e.target.value));

updateStaticTexts();
populateLines();
startLineSel.value = "TML";
populateStations(startLineSel, startStaSel, "CIO");
endLineSel.value = "TML";
populateStations(endLineSel, endStaSel, "NAC");
updateDashboard(false);
setInterval(() => updateDashboard(true), 10000);
</script>
